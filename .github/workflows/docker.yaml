name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build per ref. Pull request builds are superseded by newer pushes;
# builds for main and for tags are left to finish so a release is never
# cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and push (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Two images from one Dockerfile: `core` is the default image (`latest`,
    # `basic`, `<version>`, `sha-…`); `pdf` adds the PDF route's Pandoc and
    # docling/PyTorch runtime (`pdf`, `<version>-pdf`, `sha-…-pdf`), which on
    # amd64 carries the CUDA wheels and runs to several gigabytes, so
    # nobody pulls it by accident.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core
            rolling: latest
            alias: basic
            suffix: ""
          - target: pdf
            rolling: pdf
            suffix: -pdf

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pull requests build but never push, so a fork PR needs no credentials.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the repository name for us.
          images: ghcr.io/${{ github.repository }}
          # A semver tag would otherwise add `latest` implicitly, for both
          # matrix entries, so a release could publish the PDF image as
          # `latest`. The rolling tags are the explicit `raw` rule below and
          # nothing else: `latest`/`pdf` follow the default branch, releases
          # get `<version>` and `<version>-pdf`.
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.rolling }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.alias }},enable=${{ matrix.alias != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=sha,suffix=${{ matrix.suffix }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
