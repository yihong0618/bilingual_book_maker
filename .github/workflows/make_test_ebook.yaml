name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  
env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  BBM_CAIYUN_API_KEY: ${{ secrets.BBM_CAIYUN_API_KEY }}

jobs:
  typos-check:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v6
      - name: Check spelling with custom config file
        uses: crate-ci/typos@v1.16.6
        with:
          config: ./typos.toml
  # The PDF reading edition (--to-epub), which is an OPTIONAL install: the
  # base job above must keep passing without any of it. Its own job so the
  # base one never pays for PyTorch.
  pdf-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: install the base requirements
        run: pip install -r requirements.txt

      # The CPU route. requirements-pdf-cpu.txt names PyTorch's CPU index in
      # the file itself, so no flag is passed here -- if that line is ever
      # dropped, the assertion below fails rather than quietly downloading
      # 1.6 GB of CUDA.
      - name: install the PDF route (CPU build)
        run: pip install -r requirements-pdf-cpu.txt

      # The packaging promise, as a test. A CPU install that drags in CUDA
      # wheels is the failure this whole split exists to prevent, and it is
      # invisible in every other check.
      - name: the CPU route carries no CUDA
        run: |
            python -c "import torch; print(torch.__version__)"
            python -c "import torch, sys; sys.exit(0 if torch.version.cuda is None else 'a CUDA build was installed by the CPU route')"
            if pip list --format=freeze | grep -E '^(nvidia-|triton==)'; then
              echo "::error::the CPU route installed CUDA packages"; exit 1
            fi
            echo "no nvidia packages, as intended"

      # A pinned release, not apt: the route needs Pandoc 3.1.12 or newer
      # (its EPUB contents point at headings), and Ubuntu 24.04 ships 3.1.3.
      - name: install Pandoc (the EPUB builder)
        run: |
          curl -sSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo apt-get install -y -qq /tmp/pandoc.deb
          pandoc --version | head -1

      # Extraction alone, from the shell as an operator types it: a two-page
      # typed PDF built by the test helper, its text checked in the
      # extracted Markdown. Not hermetic: docling downloads its models on
      # this first run (~500 MB), which is why this is one job rather than
      # a matrix; the step below reuses them.
      - name: PDF extraction smoke (two pages, no OCR)
        run: |
            python -c "from pathlib import Path; from tests.pipeline_helpers import write_pdf; write_pdf(Path('ci_smoke.pdf'), pages=('The first page of a typed PDF, with a full sentence of prose on it.', 'The second page of it, also a sentence long.'))"
            python tools/pdf_to_book.py extract ci_smoke.pdf --output ci_smoke_book --pages 1-2 --device cpu
            grep -q "first page" ci_smoke_book/source.md
            grep -q "second page" ci_smoke_book/source.md

      # The route end to end on the same two pages: extract, translate with
      # the test suite's fixed stand-in translator (no model, no key), export
      # with Pandoc, then the EPUB is opened and its contents entry, both
      # phrases and each one's translation beside it are checked. A pytest
      # file because the stand-in is registered in-process; its marker keeps
      # it out of every other pytest run.
      - name: PDF route end to end (extract, translate, export)
        run: |
            pip install pytest
            python -m pytest -q -p no:cacheprovider -m pdf_route_ci tests/test_ci_pdf_route_smoke.py

      # The page-by-page export leans on docling-core's private
      # `_with_pictures_refs`, and pyproject admits docling up to 3; the
      # contract is pinned in this file, which the base job skips (no
      # docling there). Here everything it needs is installed, so a skip
      # is a failure.
      - name: docling-core contract (the page-by-page export)
        run: |
            set -o pipefail
            python -m pytest -q -p no:cacheprovider -rs tests/test_pdf_ocr_replace_layer.py | tee docling_contract.log
            if grep -q '^SKIPPED' docling_contract.log; then
              echo "::error::a docling contract test was skipped where docling is installed"; exit 1
            fi

  # The acceptance gate: every one of the 45 IDPF epub3-samples books
  # (release 20230704) must partition, classify and round-trip into a book
  # epubcheck accepts (tests/test_corpus_epub_samples.py, marker `corpus`).
  # The books are not in the repository: they are fetched from that GitHub
  # release, checked against tests/epub3-samples-20230704.sha256 and cached.
  # The tests themselves are offline (no model, no key). epubcheck 5.3.0 is
  # the version the gate's pins were measured with; with it present the
  # default suite's epubcheck tests run here too, which the testing job skips.
  epub-corpus:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ''
      BBM_CAIYUN_API_KEY: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Two commands: requirements.txt is hash-pinned, and pip refuses an
      # unpinned name on the same command line.
      - name: install the base requirements
        run: |
            pip install -r requirements.txt
            pip install pytest

      # The epubcheck release zip is cached, not the unpacked folder: the
      # zip is what the pinned digest describes.
      - name: cache the corpus and epubcheck
        id: corpus-cache
        uses: actions/cache@v6
        with:
          path: |
            epub-sample
            tools/epubcheck-5.3.0.zip
          key: epub-corpus-${{ hashFiles('tests/epub3-samples-20230704.sha256') }}-epubcheck-5.3.0-zip

      - name: fetch the corpus and epubcheck
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() { n=0; until "$@"; do n=$((n+1)); [ "$n" -ge 3 ] && return 1; echo "attempt $n failed; retrying in $((n*20))s"; sleep $((n*20)); done; }
          retry gh release download 20230704 -R IDPF/epub3-samples -p '*.epub' -D epub-sample --clobber
          mkdir -p tools
          retry curl -sSfL -o tools/epubcheck-5.3.0.zip https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip

      # On a cache hit too: the cache is keyed by the manifest, not by what
      # the files hold. epubcheck is unpacked from the verified zip on every
      # run, into a folder removed first.
      - name: verify the corpus and epubcheck
        run: |
          (cd epub-sample && sha256sum --strict -c ../tests/epub3-samples-20230704.sha256 --quiet)
          test "$(ls epub-sample | wc -l)" -eq 45
          echo "6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5  tools/epubcheck-5.3.0.zip" | sha256sum --strict -c -
          rm -rf tools/epubcheck-5.3.0
          unzip -q tools/epubcheck-5.3.0.zip -d tools
          test -f tools/epubcheck-5.3.0/epubcheck.jar

      - name: the corpus gate (45 books)
        run: python -m pytest -q -p no:cacheprovider -m corpus --durations=10 tests/test_corpus_epub_samples.py

      # A skip of an epubcheck test here means the checker was not found,
      # which is the one thing this job exists to provide.
      - name: the default suite, with epubcheck
        run: |
            set -o pipefail
            python -m pytest -q -p no:cacheprovider -rs --durations=10 | tee suite.log
            if grep -q 'epubcheck was not found' suite.log; then
              echo "::error::an epubcheck test was skipped where epubcheck is installed"; exit 1
            fi

  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip' # caching pip dependencies
      - name: Check formatting (black)
        run: |
            pip install black
            black . --check
      - name: install python requirements
        run: pip install -r requirements.txt

      - name: Test install
        run: |
            pip install .

      # The default selection is hermetic — no network, no keys, no fixtures
      # beyond test_books/ — so it runs on every PR, including forks, which
      # receive none of the secrets the provider steps below depend on. It
      # runs first because it is the fast, deterministic signal: ~40s, versus
      # the live translation calls below. The live-provider suite deselects
      # itself by marker (see pyproject.toml).
      - name: Run the test suite
        run: |
            pip install pytest
            pytest -q

      # Live smokes against the free Google endpoint, manual-only: it
      # rate-limits and times out from CI runner IPs even behind retries,
      # and everything these exercise (epub CLI, txt loader, batch_size)
      # is covered hermetically by the suite above. They test Google's
      # servers, not this code, so they gate nothing — run them from the
      # Actions tab when a live check is actually wanted.
      - name: make normal ebook test using google translate and cli
        if: github.event_name == 'workflow_dispatch'
        run: |
            retry() { n=0; until "$@"; do n=$((n+1)); [ "$n" -ge 3 ] && return 1; echo "attempt $n failed; retrying in $((n*30))s"; sleep $((n*30)); done; }
            retry bbook_maker --book_name "test_books/Liber_Esther.epub" --test --test_num 10 --api_format google --translate-tags div,p
            retry bbook_maker --book_name "test_books/Liber_Esther.epub" --test --test_num 20 --api_format google

      - name: make txt book test using google translate
        if: github.event_name == 'workflow_dispatch'
        run: |
          retry() { n=0; until "$@"; do n=$((n+1)); [ "$n" -ge 3 ] && return 1; echo "attempt $n failed; retrying in $((n*30))s"; sleep $((n*30)); done; }
          retry python3 make_book.py --book_name "test_books/the_little_prince.txt" --test --test_num 20 --api_format google

      - name: make txt book test with batch_size
        if: github.event_name == 'workflow_dispatch'
        run: |
          retry() { n=0; until "$@"; do n=$((n+1)); [ "$n" -ge 3 ] && return 1; echo "attempt $n failed; retrying in $((n*30))s"; sleep $((n*30)); done; }
          retry python3 make_book.py --book_name "test_books/the_little_prince.txt" --test --batch_size 30 --test_num 20 --api_format google
  
      - name: make caiyun translator test
        if: env.BBM_CAIYUN_API_KEY != null
        run: |
          python3 make_book.py --book_name "test_books/the_little_prince.txt" --test --batch_size 30 --test_num 100 --api_format caiyun

      - name: make openai key ebook test
        if: env.BBM_DEEPL_API_KEY != null
        run: |
            python3 make_book.py --book_name "test_books/lemo.epub" --test --test_num 5 --language zh-hans --model gpt-4o-mini
            python3 make_book.py --book_name "test_books/animal_farm.epub" --test --test_num 5 --language ja --model gpt-4o-mini --prompt prompt_template_sample.txt
            python3 make_book.py --book_name "test_books/animal_farm.epub" --test --test_num 5 --language ja --model gpt-4o-mini --prompt prompt_template.json
            python3 make_book.py --book_name test_books/Lex_Fridman_episode_322.srt --test --test_num 20 --model gpt-4o-mini
            
      - name: Rename and Upload ePub
        if: env.OPENAI_API_KEY != null
        uses: actions/upload-artifact@v6
        with:
          name: epub_output
          path: "test_books/lemo_bilingual.epub"
