name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  
env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  BBM_CAIYUN_API_KEY: ${{ secrets.BBM_CAIYUN_API_KEY }}

jobs:
  typos-check:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v6
      - name: Check spelling with custom config file
        uses: crate-ci/typos@v1.16.6
        with:
          config: ./typos.toml
  # The PDF reading edition (--to-epub), which is an OPTIONAL install: the
  # base job above must keep passing without any of it. Its own job so the
  # base one never pays for PyTorch.
  pdf-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: install the base requirements
        run: pip install -r requirements.txt

      # The CPU route. requirements-pdf-cpu.txt names PyTorch's CPU index in
      # the file itself, so no flag is passed here -- if that line is ever
      # dropped, the assertion below fails rather than quietly downloading
      # 1.6 GB of CUDA.
      - name: install the PDF route (CPU build)
        run: pip install -r requirements-pdf-cpu.txt

      # The packaging promise, as a test. A CPU install that drags in CUDA
      # wheels is the failure this whole split exists to prevent, and it is
      # invisible in every other check.
      - name: the CPU route carries no CUDA
        run: |
            python -c "import torch; print(torch.__version__)"
            python -c "import torch, sys; sys.exit(0 if torch.version.cuda is None else 'a CUDA build was installed by the CPU route')"
            if pip list --format=freeze | grep -E '^(nvidia-|triton==)'; then
              echo "::error::the CPU route installed CUDA packages"; exit 1
            fi
            echo "no nvidia packages, as intended"

      # A pinned release, not apt: the route needs Pandoc 3.1.12 or newer
      # (its EPUB contents point at headings), and Ubuntu 24.04 ships 3.1.3.
      - name: install Pandoc (the EPUB builder)
        run: |
          curl -sSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo apt-get install -y -qq /tmp/pandoc.deb
          pandoc --version | head -1

      # The route end to end on a two-page typed PDF built by the test
      # helper, its text checked in the extracted Markdown. Not hermetic:
      # docling downloads its models on this first run (~500 MB), which is
      # why this is one job and one smoke rather than a matrix.
      - name: PDF route smoke (two pages, no OCR)
        run: |
            python -c "from pathlib import Path; from tests.pipeline_helpers import write_pdf; write_pdf(Path('ci_smoke.pdf'), pages=('The first page of a typed PDF, with a full sentence of prose on it.', 'The second page of it, also a sentence long.'))"
            python tools/pdf_to_book.py extract ci_smoke.pdf --output ci_smoke_book --pages 1-2 --device cpu
            grep -q "first page" ci_smoke_book/source.md
            grep -q "second page" ci_smoke_book/source.md

  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip' # caching pip dependencies
      - name: Check formatting (black)
        run: |
            pip install black
            black . --check
      - name: install python requirements
        run: pip install -r requirements.txt

      - name: Test install
        run: |
            pip install .

      # The default selection is hermetic — no network, no keys, no fixtures
      # beyond test_books/ — so it runs on every PR, including forks, which
      # receive none of the secrets the provider steps below depend on. It
      # runs first because it is the fast, deterministic signal: ~40s, versus
      # the live translation calls below. The live-provider suite deselects
      # itself by marker (see pyproject.toml).
      - name: Run the test suite
        run: |
            pip install pytest
            pytest -q

      # Live smokes against the free Google endpoint, manual-only: it
      # rate-limits and times out from CI runner IPs even behind retries,
      # and everything these exercise (epub CLI, txt loader, batch_size)
      # is covered hermetically by the suite above. They test Google's
      # servers, not this code, so they gate nothing — run them from the
      # Actions tab when a live check is actually wanted.
      - name: make normal ebook test using google translate and cli
        if: github.event_name == 'workflow_dispatch'
        run: |
            retry() { n=0; until "$@"; do n=$((n+1)); [ "$n" -ge 3 ] && return 1; echo "attempt $n failed; retrying in $((n*30))s"; sleep $((n*30)); done; }
            retry bbook_maker --book_name "test_books/Liber_Esther.epub" --test --test_num 10 --api_format google --translate-tags div,p
            retry bbook_maker --book_name "test_books/Liber_Esther.epub" --test --test_num 20 --api_format google

      - name: make txt book test using google translate
        if: github.event_name == 'workflow_dispatch'
        run: |
          retry() { n=0; until "$@"; do n=$((n+1)); [ "$n" -ge 3 ] && return 1; echo "attempt $n failed; retrying in $((n*30))s"; sleep $((n*30)); done; }
          retry python3 make_book.py --book_name "test_books/the_little_prince.txt" --test --test_num 20 --api_format google

      - name: make txt book test with batch_size
        if: github.event_name == 'workflow_dispatch'
        run: |
          retry() { n=0; until "$@"; do n=$((n+1)); [ "$n" -ge 3 ] && return 1; echo "attempt $n failed; retrying in $((n*30))s"; sleep $((n*30)); done; }
          retry python3 make_book.py --book_name "test_books/the_little_prince.txt" --test --batch_size 30 --test_num 20 --api_format google
  
      - name: make caiyun translator test
        if: env.BBM_CAIYUN_API_KEY != null
        run: |
          python3 make_book.py --book_name "test_books/the_little_prince.txt" --test --batch_size 30 --test_num 100 --api_format caiyun

      - name: make openai key ebook test
        if: env.BBM_DEEPL_API_KEY != null
        run: |
            python3 make_book.py --book_name "test_books/lemo.epub" --test --test_num 5 --language zh-hans --model gpt-4o-mini
            python3 make_book.py --book_name "test_books/animal_farm.epub" --test --test_num 5 --language ja --model gpt-4o-mini --prompt prompt_template_sample.txt
            python3 make_book.py --book_name "test_books/animal_farm.epub" --test --test_num 5 --language ja --model gpt-4o-mini --prompt prompt_template.json
            python3 make_book.py --book_name test_books/Lex_Fridman_episode_322.srt --test --test_num 20 --model gpt-4o-mini
            
      - name: Rename and Upload ePub
        if: env.OPENAI_API_KEY != null
        uses: actions/upload-artifact@v6
        with:
          name: epub_output
          path: "test_books/lemo_bilingual.epub"
