site_name: bilingual book maker
# Path-independent: the same tree publishes from upstream and from any fork.
# The publish workflow sets these three from the repository it runs in; a
# local `mkdocs serve` or `mkdocs build` falls back to upstream's values.
site_url: !ENV [DOCS_SITE_URL, "https://yihong0618.github.io/bilingual_book_maker/"]
repo_url: !ENV [DOCS_REPO_URL, "https://github.com/yihong0618/bilingual_book_maker"]
repo_name: !ENV [DOCS_REPO_NAME, "yihong0618/bilingual_book_maker"]
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - English:
      - Home: en/index.md
      - Quick start: en/quickstart.md
      - Translate with an agent: en/agent-skill.md
      - Installation:
