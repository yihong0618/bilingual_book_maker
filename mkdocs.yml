          - Recommended settings: en/features/recommended-epub.md
          - Plan mode: en/features/plan-mode.md
          - Session mode: en/features/session-mode.md
      - PDF:
          - PDF to bilingual EPUB: en/features/pdf-to-epub.md
          - Recommended settings: en/features/recommended-pdf.md
          - Which OCR engine: en/features/pdf-ocr-engines.md
          - Installing the PDF extra: en/installation-pdf.md
          - PDF flags and the text route: en/formats/pdf.md
      - Other formats:
          - TXT: en/formats/txt.md
          - SRT: en/formats/srt.md
          - Markdown: en/formats/md.md
          - Which page for which file: en/book_source.md
      - Endpoints and models:
