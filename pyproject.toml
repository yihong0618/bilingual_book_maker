[project]
name = "bbook-maker"
description = "The bilingual_book_maker is an AI translation tool that uses ChatGPT to assist users in creating multi-language versions of epub/txt files and books."
readme = "README.md"
license = {text = "MIT"}
dynamic = ["version"]
requires-python = ">=3.10"
authors = [
    { name = "yihong0618", email = "zouzou0208@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "anthropic",
    "backoff",
    "bs4",
    "ebooklib",
    "google-genai",
    "litellm",
    # chat.completions.parse (Structured Outputs) is unavailable before 1.92.
    "openai>=1.92.0",
    "pydantic>=2.0",
    "PyDeepLX",
    "requests",
    "rich",
    "tenacity",
    "tiktoken",
    "tqdm",
    "groq>=0.5.0",
    "promptdown>=0.9.0",
    "PyMuPDF",
]

[project.scripts]
bbook_maker = "book_maker.cli:main"
promptdown = "promptdown_cli:main"

[project.urls]
Homepage = "https://github.com/yihong0618/bilingual_book_maker"

[tool.pdm]
plugins = ["pdm-autoexport"]
[[tool.pdm.autoexport]]
filename = "requirements.txt"
without-hashes = true
[build-system]
requires = ["pdm-backend>=2.0.0"]
build-backend = "pdm.backend"
[tool.pdm.version]
source = "scm"

[tool.pytest.ini_options]
markers = [
    "live_provider: calls a real translation provider (needs keys and network; run with -m live_provider)",
]
# live_provider is about the network, not about scope: the CLI contract
# tests are integration tests too, and they stay in the default run because
# they go through an offline stand-in. What deselects here is spending real
# quota — a bare `pytest` must not, and on a fork's CI run there is neither
# key nor secret to spend. Asked for by name; the default selection is
# hermetic.
addopts = "-m 'not live_provider'"
